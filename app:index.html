<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vela — Command Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:'Inter',-apple-system,sans-serif;background:#FAF8F4;color:#1C1B19;line-height:1.5;-webkit-font-smoothing:antialiased}
:root{
  --bg:#FAF8F4;--bg2:#F3F0EB;--bg3:#EEEBE5;--white:#fff;
  --border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.14);
  --text:#1C1B19;--t2:#666460;--t3:#AAAAAA;
  --accent:#E8960C;--ad:#C97E08;--abg:#FEF3DB;--abdr:#F5D98A;--atxt:#92600A;
  --green:#2A9D5C;--gbg:#E8F5EE;--gbdr:#A8D5BD;--gtxt:#1A6B3C;
  --blue:#2563EB;--bbg:#EFF4FE;--bbdr:#BFCFFB;--btxt:#1A3A8F;
  --purple:#7C3AED;--pbg:#F5F3FF;--pbdr:#DDD6FE;--ptxt:#4C1D95;
  --teal:#0D9488;--tbg:#F0FDFA;--tbdr:#99F6E4;--ttxt:#0F766E;
  --amber:#B45309;--ambbg:#FFFBEB;--ambbdr:#FDE68A;--ambtxt:#92400E;
  --red:#DC2626;--rbg:#FEF2F2;--rbdr:#FECACA;--rtxt:#991B1B;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
/* SHELL */
.shell{display:flex;height:100vh;overflow:hidden}
.sb{width:224px;flex-shrink:0;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-logo{display:flex;align-items:center;gap:9px;padding:16px 18px 13px;font-size:15px;font-weight:800;letter-spacing:-.4px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-mark{width:24px;height:24px;background:var(--accent);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-scroll{flex:1;overflow-y:auto;padding:8px 0}
.sb-sec{padding:12px 14px 5px;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--t3)}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 10px;margin:1px 8px;border-radius:7px;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;border:none;background:none;width:calc(100% - 16px);text-align:left;transition:all .15s}
.sb-item:hover{background:var(--bg2);color:var(--text)}
.sb-item.active{background:var(--abg);color:var(--atxt)}
.sb-item-count{margin-left:auto;font-size:11px;font-weight:600;background:var(--bg2);color:var(--t3);padding:1px 7px;border-radius:20px}
.sb-item.active .sb-item-count{background:rgba(232,150,12,.2);color:var(--atxt)}
.sb-mode-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;margin:4px 8px 0;letter-spacing:.04em}
.sb-mode-b2b{background:var(--pbg);color:var(--ptxt);border:1px solid var(--pbdr)}
.sb-mode-b2c{background:var(--tbg);color:var(--ttxt);border:1px solid var(--tbdr)}
.sb-upgrade{margin:8px;padding:11px 12px;background:var(--abg);border:1px solid var(--abdr);border-radius:8px;flex-shrink:0}
.sb-up-label{font-size:11px;font-weight:700;color:var(--atxt);margin-bottom:2px}
.sb-up-sub{font-size:11px;color:var(--atxt);opacity:.7;margin-bottom:8px}
.sb-footer{padding:10px;border-top:1px solid var(--border);flex-shrink:0}
.user-chip{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--bg2);border-radius:7px}
.uav{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.uname{font-size:12px;font-weight:600;color:var(--text)}
.uplan{font-size:10px;color:var(--t3)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.mhdr{flex-shrink:0;background:rgba(250,248,244,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 28px;height:54px;display:flex;align-items:center;justify-content:space-between}
.mhdr-title{font-size:14px;font-weight:700;color:var(--text)}
.mhdr-sub{font-size:11px;color:var(--t3);margin-top:1px}
.mbody{flex:1;overflow-y:auto;padding:24px 28px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-weight:600;border:none;border-radius:7px;cursor:pointer;transition:all .15s;white-space:nowrap;font-size:13px}
.bp{background:var(--accent);color:#fff;padding:9px 18px}.bp:hover{background:var(--ad)}.bp:disabled{opacity:.5;cursor:not-allowed}
.bo{background:var(--white);color:var(--t2);padding:9px 18px;border:1px solid var(--border2)}.bo:hover{border-color:rgba(0,0,0,.25);color:var(--text)}
.bg{background:transparent;color:var(--t2);padding:7px 12px;font-weight:500;border:none}.bg:hover{background:rgba(0,0,0,.05);color:var(--text)}
.bsm{font-size:12px;padding:6px 13px;border-radius:6px}
.bfull{width:100%;justify-content:center}
.bgreen{background:var(--green);color:#fff}.bgreen:hover{background:#228a4d}
.bamber{background:var(--ambbg);color:var(--ambtxt);border:1px solid var(--ambbdr)}
.bred{background:var(--rbg);color:var(--rtxt);border:1px solid var(--rbdr)}
/* CARDS */
.card{background:var(--white);border:1px solid var(--border);border-radius:11px;padding:20px 22px;margin-bottom:14px}
.card-accent{border-color:var(--abdr);background:linear-gradient(135deg,var(--abg) 0%,var(--white) 60%)}
.card-b2b{border-color:var(--pbdr);background:linear-gradient(135deg,var(--pbg) 0%,var(--white) 60%)}
.card-b2c{border-color:var(--tbdr);background:linear-gradient(135deg,var(--tbg) 0%,var(--white) 60%)}
/* FORMS */
.fg{margin-bottom:16px}.fg:last-child{margin-bottom:0}
.flabel{font-size:13px;font-weight:600;color:var(--text);display:block;margin-bottom:4px}
.fhint{font-size:12px;color:var(--t3);margin-bottom:6px;line-height:1.5}
.finput{width:100%;font-family:inherit;font-size:13px;color:var(--text);background:var(--white);border:1px solid var(--border2);border-radius:7px;padding:9px 12px;outline:none;transition:border-color .15s}
.finput:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,150,12,.1)}
.finput::placeholder{color:var(--t3)}
textarea.finput{resize:vertical;min-height:80px}
.fselect{width:100%;font-family:inherit;font-size:13px;color:var(--text);background:var(--white);border:1px solid var(--border2);border-radius:7px;padding:9px 12px;outline:none;cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23AAAAAA' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 11px center;padding-right:32px}
.fselect:focus{border-color:var(--accent);outline:none}
/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{padding:6px 13px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--border2);background:var(--white);color:var(--t2);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--abdr);color:var(--atxt);background:var(--abg)}
.chip.sel{border-color:var(--accent);background:var(--abg);color:var(--atxt)}
/* MODE SELECTOR */
.mode-wrap{min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.mode-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px}
.mode-title{font-size:26px;font-weight:800;letter-spacing:-.6px;color:var(--text);text-align:center;margin-bottom:8px}
.mode-sub{font-size:15px;color:var(--t2);text-align:center;margin-bottom:48px;line-height:1.6;max-width:480px}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%;max-width:700px}
.mode-card{background:var(--white);border:2px solid var(--border2);border-radius:16px;padding:32px 28px;cursor:pointer;transition:all .2s;text-align:left}
.mode-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,150,12,.12)}
.mode-card.sel-b2b{border-color:var(--purple);background:var(--pbg)}
.mode-card.sel-b2c{border-color:var(--teal);background:var(--tbg)}
.mode-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.mode-icon-b2b{background:var(--pbg);border:1px solid var(--pbdr)}
.mode-icon-b2c{background:var(--tbg);border:1px solid var(--tbdr)}
.mode-card-title{font-size:18px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px}
.mode-card-sub{font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:16px}
.mode-card-tags{display:flex;flex-wrap:wrap;gap:6px}
.mode-tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.mode-tag-b2b{background:var(--pbg);color:var(--ptxt);border:1px solid var(--pbdr)}
.mode-tag-b2c{background:var(--tbg);color:var(--ttxt);border:1px solid var(--tbdr)}
/* ONBOARDING */
.ob-header{text-align:center;padding:32px 24px 0;max-width:700px;margin:0 auto}
.ob-act{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.ob-title{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--text);margin-bottom:6px}
.ob-sub{font-size:14px;color:var(--t2);line-height:1.6;margin-bottom:24px}
.ob-progress{display:flex;align-items:center;gap:0;margin-bottom:8px;max-width:700px;margin-left:auto;margin-right:auto}
.op-step{display:flex;align-items:center;flex:1}
.op-step:last-child{flex:none}
.op-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;border:2px solid var(--border2);background:var(--white);color:var(--t3);transition:all .2s}
.op-dot.done{border-color:var(--green);background:var(--green);color:#fff}
.op-dot.active-b2b{border-color:var(--purple);background:var(--purple);color:#fff}
.op-dot.active-b2c{border-color:var(--teal);background:var(--teal);color:#fff}
.op-line{flex:1;height:2px;background:var(--border2);margin:0 8px;transition:background .2s}
.op-line.done{background:var(--green)}
.ob-step-labels{display:flex;justify-content:space-between;margin-bottom:28px;max-width:700px;margin-left:auto;margin-right:auto}
.ob-step-label{font-size:10px;color:var(--t3);text-align:center;flex:1;font-weight:500}
.ob-step-label.active{color:var(--text);font-weight:700}
.ob-step-label.done{color:var(--gtxt)}
.ob-wrap{max-width:700px;margin:0 auto;padding:0 24px 80px}
.act-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:14px}
.act-card-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.act-card-sub{font-size:13px;color:var(--t2);margin-bottom:20px;line-height:1.55}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* REPO REVIEW */
.rsec{margin-bottom:14px}
.rsec-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.ritem{display:flex;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border);gap:10px}
.ritem:last-child{border-bottom:none}
.rlabel{font-size:12px;color:var(--t3);min-width:120px;flex-shrink:0}
.rval{font-size:12px;color:var(--text);line-height:1.5;flex:1}
.health-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hlabel{font-size:12px;color:var(--t2);min-width:130px}
.hbg{flex:1;height:5px;background:var(--bg3);border-radius:3px}
.hfill{height:5px;border-radius:3px;background:var(--accent);transition:width .4s}
.hval{font-size:11px;color:var(--t3);min-width:32px;text-align:right;font-weight:500}
/* PIPELINE */
.stage-bar{display:flex;align-items:flex-start;margin-bottom:24px;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 18px;overflow-x:auto}
.stage-item{display:flex;flex-direction:column;align-items:center;flex:1;min-width:80px;cursor:pointer}
.stage-item:last-child{flex:none}
.stage-circle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;transition:all .2s;border:2px solid var(--border2);background:var(--white);color:var(--t3)}
.stage-circle.done{border-color:var(--green);background:var(--green);color:#fff}
.stage-circle.active{border-color:var(--accent);background:var(--accent);color:#fff}
.stage-label{font-size:10px;color:var(--t3);margin-top:6px;font-weight:500;text-align:center;white-space:nowrap}
.stage-label.active{color:var(--atxt);font-weight:700}
.stage-label.done{color:var(--gtxt);font-weight:600}
.stage-connector{flex:1;height:2px;background:var(--border2);margin:17px 4px 0;min-width:20px}
.stage-connector.done{background:var(--green)}
/* CAMPAIGN TYPE GRID */
.campaign-type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.ct-card{padding:10px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--white);cursor:pointer;transition:all .15s}
.ct-card:hover{border-color:var(--abdr);background:var(--abg)}
.ct-card.sel{border-color:var(--accent);background:var(--abg)}
.ct-label{font-size:12px;font-weight:600;color:var(--text)}
.ct-desc{font-size:11px;color:var(--t3);margin-top:2px;line-height:1.4}
.ct-card.sel .ct-label{color:var(--atxt)}
.ct-card.sel .ct-desc{color:var(--atxt);opacity:.7}
/* SMART CHANNEL SELECTOR */
.ch-rec{background:var(--white);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:8px}
.ch-rec-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--bg2)}
.ch-rec-title{font-size:12px;font-weight:700;color:var(--text)}
.ch-rec-sub{font-size:11px;color:var(--t3);margin-top:1px}
.ch-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);transition:background .15s}
.ch-item:last-child{border-bottom:none}
.ch-item:hover{background:var(--bg)}
.ch-toggle{flex-shrink:0;margin-top:1px}
.ch-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.ch-check.on{background:var(--accent);border-color:var(--accent)}
.ch-info{flex:1}
.ch-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;display:flex;align-items:center;gap:8px}
.ch-role{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.04em}
.ch-role-primary{background:var(--abg);color:var(--atxt);border:1px solid var(--abdr)}
.ch-role-supporting{background:var(--bbg);color:var(--btxt);border:1px solid var(--bbdr)}
.ch-role-optional{background:var(--bg2);color:var(--t2);border:1px solid var(--border2)}
.ch-rationale{font-size:12px;color:var(--t2);line-height:1.5}
.ch-generating{display:flex;align-items:center;gap:10px;padding:20px 14px;color:var(--t2);font-size:13px}
/* OUTPUT / MD */
.out-panel{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:16px;font-size:13px;color:var(--t2);line-height:1.75;max-height:520px;overflow-y:auto}
.out-panel h1{font-size:18px;font-weight:800;color:var(--text);margin:4px 0 14px;letter-spacing:-.3px}
.out-panel h2{font-size:14px;font-weight:700;color:var(--text);margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.out-panel h3{font-size:13px;font-weight:700;color:var(--atxt);margin:12px 0 5px}
.out-panel p{margin-bottom:8px}
.out-panel ul{margin:4px 0 10px;padding:0;list-style:none}
.out-panel ul li{display:flex;gap:8px;margin-bottom:4px}
.out-panel ul li::before{content:'•';color:var(--accent);flex-shrink:0;font-weight:700}
.out-panel ol{margin:4px 0 10px;padding:0;list-style:none;counter-reset:list}
.out-panel ol li{display:flex;gap:8px;margin-bottom:4px;counter-increment:list}
.out-panel ol li::before{content:counter(list)'.';color:var(--atxt);font-weight:600;flex-shrink:0;min-width:18px}
.out-panel hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.out-panel strong{color:var(--text);font-weight:600}
.out-panel table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:12px}
.out-panel table th{text-align:left;padding:6px 10px;background:var(--bg2);border:1px solid var(--border);font-weight:600;font-size:11px;color:var(--t2)}
.out-panel table td{padding:6px 10px;border:1px solid var(--border);vertical-align:top}
.out-panel table tr:nth-child(even) td{background:rgba(0,0,0,.02)}
/* ASSET TABS */
.asset-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.asset-tab{padding:9px 16px;font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.asset-tab:hover{color:var(--text)}
.asset-tab.active{color:var(--atxt);border-bottom-color:var(--accent);font-weight:600}
/* QA */
.qa-status{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px;font-weight:600}
.qa-pass{background:var(--gbg);border:1px solid var(--gbdr);color:var(--gtxt)}
.qa-warn{background:var(--ambbg);border:1px solid var(--ambbdr);color:var(--ambtxt)}
.qa-fail{background:var(--rbg);border:1px solid var(--rbdr);color:var(--rtxt)}
/* REVIEW BLOCK */
.review-block{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:14px 16px;margin-top:14px}
.rb-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin-bottom:10px}
.rb-pending{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rb-who{font-size:13px;font-weight:600;color:var(--text)}
.rb-note{font-size:12px;color:var(--t2);margin-top:4px}
.rb-actions{display:flex;gap:7px;flex-shrink:0}
/* STATS / DASH */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.stat-val{font-size:26px;font-weight:800;color:var(--text);letter-spacing:-1px;line-height:1}
.stat-label{font-size:12px;color:var(--t3);margin-top:3px}
.stat-sub{font-size:11px;color:var(--gtxt);margin-top:2px;font-weight:500}
/* CAMPAIGNS */
.campaign-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .15s}
.campaign-card:hover{border-color:var(--abdr)}
.cc-icon{width:40px;height:40px;border-radius:8px;background:var(--abg);border:1px solid var(--abdr);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cc-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}
.cc-meta{font-size:12px;color:var(--t3)}
.cc-stage{margin-left:auto;flex-shrink:0}
.stage-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.sp-ready{background:var(--gbg);color:var(--gtxt)}
/* MISC */
.empty{text-align:center;padding:48px 20px}
.empty-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty-sub{font-size:13px;color:var(--t2);line-height:1.6;max-width:320px;margin:0 auto 20px}
.info-box{padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.6;margin-bottom:14px}

(async function() {
  // If auth-config.js hasn't set SUPABASE_URL yet, run in demo mode — don't block
  if (typeof SUPABASE_URL === 'undefined' || SUPABASE_URL === 'YOUR_SUPABASE_PROJECT_URL') {
    window.__VELA_USER = null;
    return;
  }
  // Hide page until we know session state — prevents flash of app before redirect
  document.documentElement.style.visibility = 'hidden';
  try {
    var r = await _supabase.auth.getSession();
    var session = r && r.data && r.data.session;
    if (!session) {
      window.location.replace('/login');
      return;
    }
    window.__VELA_USER = {
      id:    session.user.id,
      email: session.user.email,
      name:  (session.user.user_metadata && session.user.user_metadata.full_name)
               ? session.user.user_metadata.full_name
               : session.user.email.split('@')[0],
      mode:  (session.user.user_metadata && session.user.user_metadata.mode)
               ? session.user.user_metadata.mode
               : null
    };
  } catch(e) {
    // Network error or Supabase down — let the app load in demo mode
    window.__VELA_USER = null;
  }
  document.documentElement.style.visibility = 'visible';
})();

// MARKDOWN RENDERER
function MD({text}){
  if(!text)return React.createElement('span',{style:{color:'var(--t3)',fontSize:13}},'Output will appear here.');
  const lines=text.split('\n');const out=[];let tbl=[];
  const flushTbl=()=>{
    if(!tbl.length)return;
    const rows=tbl.filter(l=>!l.trim().match(/^\|[-\s:|]+\|$/)).map(l=>l.split('|').slice(1,-1).map(c=>c.trim()));
    if(rows.length)out.push(React.createElement('div',{key:`t${out.length}`,style:{overflowX:'auto',marginBottom:12}},
      React.createElement('table',null,
        React.createElement('thead',null,React.createElement('tr',null,...rows[0].map((h,i)=>React.createElement('th',{key:i},h)))),
        React.createElement('tbody',null,...rows.slice(1).map((r,ri)=>React.createElement('tr',{key:ri},...r.map((c,ci)=>React.createElement('td',{key:ci},c))))))));tbl=[];};
  const pb=t=>{if(!t||typeof t!=='string')return t;return t.split(/(\*\*[^*]+\*\*)/).map((p,i)=>p.startsWith('**')&&p.endsWith('**')&&p.length>4?React.createElement('strong',{key:i},p.slice(2,-2)):p);};
  lines.forEach((line,i)=>{
    if(line.trim().startsWith('|')){tbl.push(line);return;}if(tbl.length)flushTbl();
    if(line.startsWith('# '))out.push(React.createElement('h1',{key:i},pb(line.slice(2))));
    else if(line.startsWith('## '))out.push(React.createElement('h2',{key:i},pb(line.slice(3))));
    else if(line.startsWith('### '))out.push(React.createElement('h3',{key:i},pb(line.slice(4))));
    else if(line.match(/^---+$/))out.push(React.createElement('hr',{key:i}));
    else if(line.startsWith('- ')||line.startsWith('* '))out.push(React.createElement('ul',{key:i},React.createElement('li',null,pb(line.slice(2)))));
    else if(/^\d+\.\s/.test(line)){const m=line.match(/^(\d+)\.\s(.*)/);if(m)out.push(React.createElement('ol',{key:i},React.createElement('li',null,pb(m[2]))));}
    else if(line.trim()==='')out.push(React.createElement('div',{key:i,style:{height:6}}));
    else out.push(React.createElement('p',{key:i},pb(line)));
  });
  if(tbl.length)flushTbl();
  return React.createElement('div',null,...out);
}

async function callClaude(system,user,maxTokens=1000){
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens,system,messages:[{role:'user',content:user}]})
    });
    const d=await r.json();
    if(d.content&&d.content[0]&&d.content[0].text)return d.content[0].text;
    return '[Demo mode — connect API key for live generation]';
  }catch(e){return '[Demo mode — API not connected. In the live product this generates using your repository context.]';}
}

Where they shop: ${repo.shopping_channels||'Not defined'}

Emotional driver: ${repo.emotional_driver||'Not defined'}
Aspiration: ${repo.aspiration||'Not defined'}
Price point: ${repo.price_point||'Not defined'}

- Readability: Grade 7-8. Short sentences. Punchy paragraphs. No walls of text.

- CTAs: action verb + specific outcome. Never "Shop now", "Learn more", or "Click here".`;
  const voice=`

${repo.voice_example?`VOICE EXAMPLE (study this rhythm and register exactly): "${repo.voice_example}"`:''}

function buildQAPrompt(repo,signal,channels,assets){
  const isB2B=repo.mode==='b2b';
  const modeRules=isB2B
    ?`B2B HARD STOPS: Unattributed statistic. Passive voice clusters (3+). Feature without tied outcome. CTA = "Learn more"/"Click here"/"Submit". Cold outreach opening with "I". Filler words: revolutionary, game-changing, seamless, leverage, synergize, robust, empower, best-in-class.`

${modeRules}
${repo.avoid?`Also HARD STOP if found: ${repo.avoid}`:''}
MAJOR: Tone inconsistency, headline that could belong to any brand.
MINOR: Word choice drift, length deviation.

## ROUND 2 — CLAIMS AND ACCURACY
HARD STOP: Unattributed statistic, fabricated capability, performance guarantee without named source.
MAJOR: Stat present but source unnamed inline.
MINOR: Inconsistent citation format.

[Table]

## ROUND 2 — CLAIMS AND ACCURACY
[Table]

[Table]

Numbered. Asset | Section | Exact correction. Actionable without clarification.

${assets}`;

function StagePipeline({stage,stagesReached,activeTab,onTab}){
  const curIdx=STAGES.findIndex(s=>s.id===stage);
  return React.createElement('div',{className:'stage-bar'},
    STAGES.map((s,i)=>{
      const done=i<curIdx;const active=s.id===stage;const tab=s.id===activeTab;

        React.createElement('div',{className:'stage-item',onClick:()=>reached&&onTab(s.id)},
          React.createElement('div',{className:`stage-circle ${done?'done':active?'active':''}`,style:tab&&!done&&!active?{boxShadow:'0 0 0 3px rgba(232,150,12,.25)'}:{}},done?React.createElement(IcoCheck):i+1),

// SMART CHANNEL SELECTOR
function SmartChannelSelector({repo,signal,onConfirm}){
  const [status,setStatus]=useState('idle'); // idle | generating | done | error
  const [recs,setRecs]=useState([]);
  const [stratNote,setStratNote]=useState('');
  const [toggled,setToggled]=useState({});
  const [error,setError]=useState('');

  async function getRecommendations(){
    setStatus('generating');setError('');
    try{
      const prompt=buildChannelPrompt(repo,signal);
      const raw=await callClaude('You are a campaign channel strategist. Return only valid JSON.',prompt,600);
      let parsed;
      try{
        const clean=raw.replace(/```json|```/g,'').trim();
        parsed=JSON.parse(clean);
      }catch(e){
        // fallback: demo channels based on mode
        const isB2B=repo.mode==='b2b';
        parsed={
          channels:isB2B?[
            {id:'email_sequence',name:'Email sequence',role:'Primary',rationale:'Multi-touch nurture is the core B2B pipeline driver for this campaign type.'},
            {id:'linkedin_posts',name:'LinkedIn posts',role:'Supporting',rationale:'Extends reach to professional audience while nurture runs in parallel.'},
            {id:'landing_page',name:'Landing page',role:'Supporting',rationale:'Campaign needs a conversion surface to capture inbound from LinkedIn.'},
          ]:[
            {id:'email',name:'Email sequence',role:'Primary',rationale:'Email drives the highest ROI for DTC retention and lifecycle campaigns.'},
            {id:'instagram_captions',name:'Instagram captions',role:'Primary',rationale:'Visual platform aligns with where this customer discovers and engages.'},
            {id:'ad_copy',name:'Ad copy',role:'Supporting',rationale:'Paid amplification accelerates reach for this campaign type.'},
          ],
          strategy_note:'These channels work together as a push-pull system — paid brings new eyes while email converts warm audiences.'
        };
      }
      const init={};
      (parsed.channels||[]).forEach(c=>{init[c.id]=true;});
      setRecs(parsed.channels||[]);
      setStratNote(parsed.strategy_note||'');
      setToggled(init);
      setStatus('done');
    }catch(e){setError('Could not get recommendations. Please try again.');setStatus('error');}
  }

  const selectedChannels=recs.filter(c=>toggled[c.id]);
  const roleLabel=r=>r==='Primary'?'Primary':r==='Supporting'?'Supporting':'Optional';
  const roleClass=r=>r==='Primary'?'ch-role-primary':r==='Supporting'?'ch-role-supporting':'ch-role-optional';

  if(status==='idle')return React.createElement('div',{style:{marginTop:8}},
    React.createElement('div',{className:'info-box info-blue',style:{marginBottom:10}},'Based on your campaign type and goal, your agent will recommend the best channel mix. You can adjust before proceeding.'),
    React.createElement('button',{className:'btn bp bsm',onClick:getRecommendations},React.createElement(IcoSpark),' Get channel recommendations')
  );

  if(status==='generating')return React.createElement('div',{className:'ch-rec'},
    React.createElement('div',{className:'ch-generating'},
      React.createElement('div',{className:'spinner-dark'}),
      React.createElement('span',null,'Analyzing campaign brief and recommending channels...')
    )
  );

  if(status==='error')return React.createElement('div',null,
    React.createElement('div',{className:'info-box',style:{background:'var(--rbg)',border:'1px solid var(--rbdr)',color:'var(--rtxt)',marginBottom:10}},error),
    React.createElement('button',{className:'btn bo bsm',onClick:getRecommendations},'Try again')
  );

  return React.createElement('div',{className:'fade-in'},
    React.createElement('div',{className:'ch-rec'},
      React.createElement('div',{className:'ch-rec-header'},
        React.createElement('div',null,
          React.createElement('div',{className:'ch-rec-title'},'Recommended channel mix'),
          stratNote&&React.createElement('div',{className:'ch-rec-sub'},stratNote)
        ),
        React.createElement('button',{className:'btn bg bsm',style:{fontSize:11},onClick:getRecommendations},'Regenerate')
      ),
      recs.map(ch=>React.createElement('div',{key:ch.id,className:'ch-item'},
        React.createElement('div',{className:'ch-toggle'},
          React.createElement('div',{className:`ch-check ${toggled[ch.id]?'on':''}`,onClick:()=>setToggled(t=>({...t,[ch.id]:!t[ch.id]}))},
            toggled[ch.id]&&React.createElement(IcoCheck)
          )
        ),
        React.createElement('div',{className:'ch-info'},
          React.createElement('div',{className:'ch-name'},
            ch.name,
            React.createElement('span',{className:`ch-role ${roleClass(ch.role)}`},roleLabel(ch.role))
          ),
          React.createElement('div',{className:'ch-rationale'},ch.rationale)
        )
      ))
    ),
    selectedChannels.length>0&&React.createElement('div',{style:{display:'flex',justifyContent:'flex-end',marginTop:12}},
      React.createElement('button',{className:'btn bp',onClick:()=>onConfirm(selectedChannels)},
        React.createElement(IcoCheck),` Confirm ${selectedChannels.length} channel${selectedChannels.length>1?'s':''} & continue`
      )
    )
  );
}

  const [confirmedChannels,setConfirmedChannels]=useState([]);
  const [strategy,setStrategy]=useState('');
  const [assets,setAssets]=useState('');
  const [qaResult,setQaResult]=useState('');
  const [activeAssetTab,setActiveAssetTab]=useState('full');

  const setSig=(k,v)=>setSignal(p=>({...p,[k]:v}));

  const canAdvanceSignal=signal.campaign_name.trim()&&signal.campaign_type&&confirmedChannels.length>0&&signal.key_message.trim()&&signal.goal.trim();

  async function genStrategy(){
    setGenerating(true);
    const out=await callClaude(buildSys(repo),buildStrategyPrompt(repo,signal,confirmedChannels),1500);

  const qaStatus=qaResult.includes('FAIL')||qaResult.includes('HARD STOP')?'fail':qaResult.includes('CONDITIONAL')?'warn':qaResult.length>10?'pass':'';
  const copy=t=>{navigator.clipboard.writeText(t).then(()=>showToast('Copied to clipboard'));};

  const allMarkers=confirmedChannels.map(c=>c.name.toUpperCase());
  const assetSections=assets?[
    {id:'full',label:'Full package'},

    const marker='## '+ch.name.toUpperCase();

      return assets.slice(start,end);

    const rest=assets.slice(idx+marker.length);
    const nextSection=rest.search(/\n## /);
