<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Log in — Vorsa</title>

<!-- Supabase JS client (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth-config.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#FAF8F4;color:#1C1B19;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{cursor:pointer;font-family:inherit}
:root{
  --bg:#FAF8F4;--bg2:#F3F0EB;--bg3:#EEEBE5;--white:#FFFFFF;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.13);
  --text:#1C1B19;--text2:#666460;--text3:#AAAAAA;
  --accent:#E8960C;--accent-d:#C97E08;--accent-bg:#FEF3DB;--accent-bdr:#F5D98A;--accent-txt:#92600A;
  --green:#2A9D5C;--green-bg:#E8F5EE;--green-bdr:#A8D5BD;--green-txt:#1A6B3C;
  --red:#DC2626;--red-bg:#FEF2F2;--red-bdr:#FECACA;--red-txt:#991B1B;
  --purple:#7C3AED;--purple-bg:#F5F3FF;--purple-bdr:#DDD6FE;--purple-txt:#4C1D95;
  --teal:#0D9488;--teal-bg:#F0FDFA;--teal-bdr:#99F6E4;--teal-txt:#0F766E;
  --nav-h:60px;
}
/* NAV */
#nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:var(--nav-h);background:rgba(250,248,244,0.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);transition:box-shadow .2s}
#nav.scrolled{box-shadow:0 2px 20px rgba(0,0,0,0.06)}
.nav-logo{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;letter-spacing:-.4px;color:var(--text)}
.nav-logo-mark{width:26px;height:26px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-links{display:flex;align-items:center;gap:32px}
.nav-links a{font-size:13px;color:var(--text2);transition:color .15s}
.nav-links a:hover{color:var(--text)}
.nav-actions{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-weight:600;border:none;border-radius:8px;cursor:pointer;transition:all .15s;white-space:nowrap;text-decoration:none;line-height:1;font-size:14px}
.btn-primary{background:var(--accent);color:#fff;padding:10px 22px}.btn-primary:hover{background:var(--accent-d)}
.btn-ghost{background:transparent;color:var(--text2);font-size:13px;padding:7px 14px;font-weight:500;border:none}.btn-ghost:hover{background:rgba(0,0,0,.05);color:var(--text)}
.btn-sm{font-size:12px;padding:6px 14px;border-radius:6px}
/* AUTH LAYOUT */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(var(--nav-h) + 40px) 24px 60px}
.auth-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:440px;box-shadow:0 4px 32px rgba(0,0,0,.06)}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:9px;font-size:18px;font-weight:800;letter-spacing:-.4px;margin-bottom:28px}
.auth-logo-mark{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center}
.auth-title{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--text);text-align:center;margin-bottom:6px}
.auth-sub{font-size:14px;color:var(--text2);text-align:center;margin-bottom:28px;line-height:1.6}
/* FORMS */
.fg{margin-bottom:18px}
.flabel{font-size:13px;font-weight:600;color:var(--text);display:block;margin-bottom:5px}
.finput{width:100%;font-family:inherit;font-size:14px;color:var(--text);background:var(--white);border:1px solid var(--border2);border-radius:8px;padding:11px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
.finput:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,150,12,.1)}
.finput::placeholder{color:var(--text3)}
.finput.error{border-color:var(--red);box-shadow:0 0 0 3px rgba(220,38,38,.08)}
.input-pw{position:relative}
.input-pw .finput{padding-right:52px}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;font-weight:500;padding:4px 6px}
.pw-toggle:hover{color:var(--text2)}
/* ERRORS & ALERTS */
.field-error{font-size:11px;color:var(--red);margin-top:5px;display:none;font-weight:500}
.field-error.show{display:block}
.alert{border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:16px;display:none;line-height:1.5}
.alert.show{display:block}
.alert-error{background:var(--red-bg);border:1px solid var(--red-bdr);color:var(--red-txt)}
.alert-success{background:var(--green-bg);border:1px solid var(--green-bdr);color:var(--green-txt)}
.alert-info{background:var(--accent-bg);border:1px solid var(--accent-bdr);color:var(--accent-txt)}
/* DIVIDER */
.auth-divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--text3);font-size:12px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border2)}
/* SOCIAL */
.auth-social{display:flex;gap:10px;margin-bottom:4px}
.social-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;background:var(--white);border:1px solid var(--border2);border-radius:8px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s}
.social-btn:hover{border-color:rgba(0,0,0,.2);color:var(--text)}
/* MODE PILLS */
.mode-pills{display:flex;gap:8px;margin-top:6px}
.mode-pill{flex:1;padding:10px 12px;border-radius:8px;border:1.5px solid var(--border2);background:var(--white);cursor:pointer;transition:all .15s;text-align:center;user-select:none}
.mode-pill:hover{border-color:var(--accent-bdr)}
.mode-pill.sel-b2b{border-color:var(--purple);background:var(--purple-bg)}
.mode-pill.sel-b2c{border-color:var(--teal);background:var(--teal-bg)}
.mode-pill-label{font-size:13px;font-weight:600;color:var(--text);display:block;margin-bottom:2px}
.mode-pill.sel-b2b .mode-pill-label{color:var(--purple-txt)}
.mode-pill.sel-b2c .mode-pill-label{color:var(--teal-txt)}
.mode-pill-sub{font-size:11px;color:var(--text3)}
.mode-pill.sel-b2b .mode-pill-sub,.mode-pill.sel-b2c .mode-pill-sub{opacity:.7}
.mode-pill.sel-b2b .mode-pill-sub{color:var(--purple-txt)}
.mode-pill.sel-b2c .mode-pill-sub{color:var(--teal-txt)}
/* SUBMIT */
.submit-btn{width:100%;justify-content:center;padding:13px;font-size:15px;border-radius:8px;margin-top:6px;font-weight:700;letter-spacing:-.2px}
.submit-btn:disabled{opacity:.55;cursor:not-allowed}
/* FOOTER TEXT */
.auth-footer-text{text-align:center;font-size:13px;color:var(--text3);margin-top:20px}
.auth-footer-text a{color:var(--accent-txt);font-weight:500}
.auth-footer-text a:hover{text-decoration:underline}
.auth-terms{font-size:11px;color:var(--text3);text-align:center;margin-top:14px;line-height:1.6}
.auth-terms a{color:var(--text3);text-decoration:underline}
/* VERIFY / CONFIRM STATES */
.confirm-icon{width:64px;height:64px;border-radius:50%;background:var(--green-bg);border:1px solid var(--green-bdr);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.forgot-link{display:block;text-align:right;font-size:12px;color:var(--text3);margin-top:6px;transition:color .15s}
.forgot-link:hover{color:var(--accent-txt)}
/* SPINNER */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@media(max-width:600px){#nav{padding:0 20px}.nav-links{display:none}.auth-card{padding:28px 20px}.auth-wrap{padding:calc(var(--nav-h) + 20px) 16px 40px}}
</style>

</head>
<body>
<nav id="nav">
  <a href="/" class="nav-logo">
    <div class="nav-logo-mark"><svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M7 1L13 7L7 13L1 7L7 1Z" fill="white"/></svg></div>
    Vorsa
  </a>
  <ul class="nav-links">
    <li><a href="/how-it-works">How it works</a></li>
    <li><a href="/features">Features</a></li>
    <li><a href="/pricing">Pricing</a></li>
  </ul>
  <div class="nav-actions">
    <a href="/login" class="btn btn-ghost">Log in</a>
    <a href="/signup" class="btn btn-primary btn-sm">Start free</a>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-mark"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1L13 7L7 13L1 7L7 1Z" fill="white"/></svg></div>
      Vorsa
    </div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Log in to your workspace to continue building campaigns.</p>

    <div id="alert-error" class="alert alert-error"></div>
    <div id="alert-success" class="alert alert-success"></div>

    <div class="auth-social">
      <button class="social-btn" onclick="signInWithGoogle()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M15.68 8.18c0-.57-.05-1.12-.14-1.64H8v3.1h4.31a3.68 3.68 0 01-1.6 2.42v2h2.58c1.51-1.39 2.39-3.44 2.39-5.88z" fill="#4285F4"/><path d="M8 16c2.16 0 3.97-.72 5.3-1.94l-2.58-2c-.72.48-1.63.76-2.72.76-2.09 0-3.86-1.41-4.49-3.31H.84v2.07A8 8 0 008 16z" fill="#34A853"/><path d="M3.51 9.51A4.8 4.8 0 013.26 8c0-.53.09-1.04.25-1.51V4.42H.84A8 8 0 000 8c0 1.29.31 2.51.84 3.58l2.67-2.07z" fill="#FBBC05"/><path d="M8 3.18c1.18 0 2.23.4 3.06 1.2l2.3-2.3C11.97.72 10.16 0 8 0A8 8 0 00.84 4.42l2.67 2.07C4.14 4.59 5.91 3.18 8 3.18z" fill="#EA4335"/></svg>
        Continue with Google
      </button>
    </div>

    <div class="auth-divider">or continue with email</div>

    <!-- EMAIL + PASSWORD FORM -->
    <form id="login-form" onsubmit="handleLogin(event)" novalidate>
      <div class="fg">
        <label class="flabel" for="email">Email</label>
        <input class="finput" id="email" type="email" placeholder="alex@yourcompany.com" autocomplete="email" required>
        <div class="field-error" id="email-error">Please enter a valid email</div>
      </div>

      <div class="fg">
        <label class="flabel" for="password">Password</label>
        <div class="input-pw">
          <input class="finput" id="password" type="password" placeholder="Your password" autocomplete="current-password">
          <button type="button" class="pw-toggle" onclick="togglePw()">Show</button>
        </div>
        <a href="/forgot-password" class="forgot-link">Forgot password?</a>
      </div>

      <div style="display:flex;gap:10px;margin-top:4px">
        <button type="submit" class="btn btn-primary submit-btn" id="submit-btn" style="flex:2">
          Log in
        </button>
        <button type="button" class="btn submit-btn" id="magic-btn"
          style="flex:1;background:var(--bg2);color:var(--text2);border:1px solid var(--border2);font-size:13px"
          onclick="sendMagicLink()">
          Magic link
        </button>
      </div>
    </form>

    <p class="auth-footer-text" style="margin-top:20px">
      Don't have an account? <a href="/signup">Start free</a>
    </p>
  </div>
</div>

<script>
function togglePw() {
  var inp = document.getElementById('password');
  var btn = inp.nextElementSibling;
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? 'Show' : 'Hide';
}

function showError(msg) {
  document.getElementById('alert-success').classList.remove('show');
  var el = document.getElementById('alert-error');
  el.innerHTML = msg;
  el.classList.add('show');
}

function showSuccess(msg) {
  document.getElementById('alert-error').classList.remove('show');
  var el = document.getElementById('alert-success');
  el.textContent = msg;
  el.classList.add('show');
}

function setLoading(btnId, loading, label) {
  var btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.innerHTML = loading ? '<div class="spinner"></div> ' + label : label.replace('...','');
}

function getEmail() {
  var email = document.getElementById('email').value.trim();
  var ok = /^[^@]+@[^@]+\.[^@]+$/.test(email);
  if (!ok) { document.getElementById('email-error').classList.add('show'); document.getElementById('email').classList.add('error'); }
  else { document.getElementById('email-error').classList.remove('show'); document.getElementById('email').classList.remove('error'); }
  return ok ? email : null;
}

async function signInWithGoogle() {
  var { error } = await _supabase.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/app' }
  });
  if (error) showError(error.message);
}

async function handleLogin(e) {
  e.preventDefault();
  var email = getEmail();
  if (!email) return;
  var pw = document.getElementById('password').value;
  if (!pw) { showError('Please enter your password.'); return; }

  setLoading('submit-btn', true, 'Logging in...');

  var { data, error } = await _supabase.auth.signInWithPassword({ email, password: pw });

  setLoading('submit-btn', false, 'Log in');

  if (error) {
    var msg = error.message;
    if (msg.includes('Invalid login')) msg = 'Incorrect email or password. <a href="/forgot-password" style="font-weight:600;text-decoration:underline">Reset your password</a>';
    if (msg.includes('Email not confirmed')) msg = 'Please confirm your email first. <a href="/verify-email" style="font-weight:600;text-decoration:underline">Resend confirmation</a>';
    showError(msg);
    return;
  }

  try { sessionStorage.setItem('Vorsa_session_hint', '1'); } catch(e) {}
  window.location.replace('/app');
}

async function sendMagicLink() {
  var email = getEmail();
  if (!email) return;

  setLoading('magic-btn', true, 'Sending...');

  var { error } = await _supabase.auth.signInWithOtp({
    email: email,
    options: { emailRedirectTo: window.location.origin + '/app' }
  });

  setLoading('magic-btn', false, 'Magic link');

  if (error) { showError(error.message); return; }
  showSuccess('Magic link sent to ' + email + '. Check your inbox — it expires in 1 hour.');
  document.getElementById('login-form').style.opacity = '0.4';
  document.getElementById('login-form').style.pointerEvents = 'none';
}
</script>

<script>
window.addEventListener('scroll',function(){document.getElementById('nav').classList.toggle('scrolled',window.scrollY>10);});
</script>
</body>
</html>
